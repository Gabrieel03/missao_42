<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Tab</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            gap: 0;
            box-sizing: border-box;
        }

        body {

            flex: content;
            flex-direction: column;
            padding: 40px;
            font-family: Arial, sans-serif;
        }

        table {
            text-align: center;
            width: 100%;
            border-collapse: collapse;
        }

        hr {
            width: 100%;
            padding-bottom: 5px;
        }

        td {
            text-align: center;
            border: 1px solid #000;
            padding: 40px 20px;
            font-size: 19px;
        }

        .celula-esquerda {
            background-color: aqua;
            color: #333;
        }

        .celula-direita {
            background-color: darkorange;
            color: #333;
        }

    </style>
</head>
<body>
    <table>
        <tr>
            <td class="celula-esquerda">First cell</td>
            <td class="celula-direita">Secound cell</td>
        </tr>
    </table>
</body>
</html>
