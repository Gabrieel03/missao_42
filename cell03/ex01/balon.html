<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balon</title>
    <style>
        body, html{
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #balao{
            height: 200px;
            width: 200px;
            background-color: red;
            display: flex;
            border-radius: 50%;
            color:white;
            user-select: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

    </style>

</head>
<body>
    
    <div id = "balao"class="balon"></div>

    <script>
        const ballon = document.getElementById("balao")

        const color = [
            'red',
            'green',
            'blue'
        ]
        
        let colorIndex=0;
        let size = MIN_SIZE;

        function applyStyle(){
            ballon.style.width = size + 'px';
            ballon.style.height = size + 'px';
            ballon.style.backgroundColor = color[colorIndex]
        }

        ballon.addEventListener('click', () =>{
            size += GROW
        })

    </script>
</body>
</html>
