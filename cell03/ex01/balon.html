<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloon</title>
    <style>
        body, html{
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #balao{
            height: 200px;
            width: 200px;
            background-color: red;
            display: flex;
            border-radius: 50%;
            color: white;
            user-select: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div id="balao" class="balon"></div>

    <script>
        const MIN_SIZE = 200;
        const MAX_SIZE = 420;
        const GROW = 10;
        const SHRINK = 5;

        const balao = document.getElementById("balao");

        const colors = [
            'red',
            'green',
            'blue'
        ];

        let colorIndex = 0;
        let size = MIN_SIZE;

        function applyStyle(){
            balao.style.width = size + 'px';
            balao.style.height = size + 'px';
            balao.style.backgroundColor = colors[colorIndex];
        }

        function explode(){
            size = MIN_SIZE;
            colorIndex = 0;
            applyStyle();
        }

        balao.addEventListener('click', () => {
            size += GROW;
            colorIndex = (colorIndex + 1) % colors.length;

            if (size > MAX_SIZE){
                explode();
                return;
            }

            applyStyle();
        });

        balao.addEventListener('mouseleave', () => {
            size = Math.max(MIN_SIZE, size - SHRINK);
            colorIndex = (colorIndex - 1 + colors.length) % colors.length;
            applyStyle();
        });

        applyStyle();
    </script>
</body>
</html>
