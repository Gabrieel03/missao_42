<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do or not to do</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #f2f2f2;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 20px;
        }

        #add-task {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #2d6cdf;
            color: white;
            margin-bottom: 20px;
        }

        #add-task:hover {
            background-color: #1f4fae;
        }

        #ft_list {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task {
            background: white;
            padding: 12px 16px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            word-wrap: break-word;
        }

        .task:hover {
            background-color: #ffecec;
        }
    </style>
</head>

<body>

    <h1>To do or not to do</h1>
    <button id="add-task">Adicionar tarefa</button>
    <div id="ft_list"></div>

    <script src="todo.js"></script>
</body>

</html>
